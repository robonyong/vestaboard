name: Build & Push

on:
  push:
    branches: [update-deps]

jobs:
  build-fe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build FE
        run: ./build_fe.sh

      - name: Archive FE artifact
        run: tar -czf tmp-fe-build.tar.gz tmp-fe-build

      - name: Upload FE artifact
        uses: actions/upload-artifact@v7
        with:
          name: tmp-fe-build
          path: tmp-fe-build.tar.gz
          if-no-files-found: error

  build-image:
    needs: build-fe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Download FE artifact
        uses: actions/download-artifact@v7
        with:
          name: tmp-fe-build

      - name: Extract FE artifact
        run: tar -xzf tmp-fe-build.tar.gz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: bucatini/vbcontroller:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=vbcontroller-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=vbcontroller-${{ matrix.suffix }}

  publish-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish multi-arch latest manifest
        run: |
          docker buildx imagetools create \
            --tag bucatini/vbcontroller:latest \
            bucatini/vbcontroller:latest-amd64 \
            bucatini/vbcontroller:latest-arm64
