name: Build & Push

on:
  push:
    branches: [update-deps]

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: bucatini/vbcontroller:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=vbcontroller-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=vbcontroller-${{ matrix.suffix }}

  publish-manifest:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish multi-arch latest manifest
        run: |
          docker buildx imagetools create \
            --tag bucatini/vbcontroller:latest \
            bucatini/vbcontroller:latest-amd64 \
            bucatini/vbcontroller:latest-arm64
